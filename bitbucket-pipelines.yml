# =============================================================================
# RMC Frontend — Bitbucket Pipelines
# Builds Angular app and deploys to S3 frontend buckets.
#
# Branch mapping:
#   dev    → dev (lightweight build)
#   master → staging (auto) → prod (manual)
#
# Account: 723108571698 | Region: ap-southeast-1
#
# Required Repository Variables:
#   AWS_ACCESS_KEY_ID              — IAM deployer access key
#   AWS_SECRET_ACCESS_KEY          — IAM deployer secret key
#   CLOUDFRONT_DISTRIBUTION_ID_DEV    — CloudFront distribution ID for dev
#   CLOUDFRONT_DISTRIBUTION_ID_PROD — CloudFront distribution ID for staging
#   CLOUDFRONT_DISTRIBUTION_ID_PROD   — CloudFront distribution ID for prod
# =============================================================================

image: node:22

pipelines:
  branches:
    dev:
      - step:
          name: Build & Deploy → dev
          caches:
            - node
          script:
            - npm ci
            - npm run build -- --configuration=dev
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                S3_BUCKET: 'frontend-rmc-dev'
                LOCAL_PATH: 'dist/RMC_project/browser'
                DELETE_FLAG: 'true'
            - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID_DEV
          artifacts:
            - dist/**
    master:
      - step:
          name: Build & Deploy → staging
          caches:
            - node
          script:
            - npm ci
            - npm run build -- --configuration=staging
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                S3_BUCKET: 'rmc-frontend-dev'
                LOCAL_PATH: 'dist/RMC_project/browser'
                DELETE_FLAG: 'true'
            - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID_DEV
          artifacts:
            - dist/**
      - step:
          name: Build & Deploy → prod
          trigger: manual
          caches:
            - node
          script:
            - npm ci
            - npm run build -- --configuration=production
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                S3_BUCKET: 'rmc-frontend-prod'
                LOCAL_PATH: 'dist/RMC_project/browser'
                DELETE_FLAG: 'true'
            - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: 'ap-southeast-1'
                DISTRIBUTION_ID: $CLOUDFRONT_DISTRIBUTION_ID_PROD
          artifacts:
            - dist/**

    
