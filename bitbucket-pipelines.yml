pipelines:
  branches:
    dev:
      - step:
          name: Build and Deploy to Dev
          image: node:22
          caches:
            - node
          deployment: test
          script:
            - npm ci
            - npx ng build --configuration=production
            - echo "Build output:" && ls dist/
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: "ap-southeast-1"
                S3_BUCKET: "rmc-frontend-dev"
                LOCAL_PATH: "dist/RMC_project/browser"
                DELETE_FLAG: "true"
    master:
      - step:
          name: Build and Deploy to Staging
          image: node:22
          caches:
            - node
          deployment: staging
          script:
            - npm ci
            - npx ng build --configuration=production
            - echo "Build output:" && ls dist/
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: "ap-southeast-1"
                S3_BUCKET: "rmc-frontend-staging"
                LOCAL_PATH: "dist/RMC_project/browser"
                DELETE_FLAG: "true"
      - step:
          name: Deploy to Production
          image: node:22
          caches:
            - node
          trigger: manual
          deployment: production
          script:
            - npm ci
            - npx ng build --configuration=production
            - echo "Build output:" && ls dist/
            - pipe: atlassian/aws-s3-deploy:1.1.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: "ap-southeast-1"
                S3_BUCKET: "rmc-frontend-prod"
                LOCAL_PATH: "dist/RMC_project/browser"
                DELETE_FLAG: "true"
