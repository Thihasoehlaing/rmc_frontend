<form [formGroup]="form" class="form-section">
  <!-- Section 1: Applicant Details -->
  <div class="card">
    <app-custom-subheader icon="person" title="Applicant Details"></app-custom-subheader>
    <div class="card__content section-fields">
      <div class="row row--2">
        <div class="form-field">
          <label class="form-label">Applicant Name (Principal Supervisor/Project Leader etc.)</label>
          <input type="text" class="input--text input--soft-readonly" [value]="auth.currentUser()?.name || ''" readonly>
        </div>
        <div class="form-field">
          <label class="form-label is-required">School Name</label>
          <select formControlName="schoolName" class="input--text" [class.is-invalid]="form.get('schoolName')?.invalid && form.get('schoolName')?.touched">
            <option value="" disabled selected>Select School</option>
            <option value="SBM">School of Business and Management (SBM)</option>
            <option value="SOC">School of Computing (SOC)</option>
            <option value="SOE">School of Engineering (SOE)</option>
            <option value="SOM">School of Media, Arts and Design (SOMAD)</option>
          </select>
          <app-validation-message [control]="form.get('schoolName')"></app-validation-message>
        </div>
      </div>
    </div>
  </div>

  <!-- Section 2: Project / Research Cluster Details -->
  <div class="card">
    <app-custom-subheader icon="article" title="Project / Research Cluster Details"></app-custom-subheader>
    <div class="card__content section-fields">
      <div class="row row--2">
        <!-- Left Column -->
        <div class="form-column">
          <div class="form-field">
            <div class="label-with-note">
              <label class="form-label is-required">Position Requested</label>
              <app-note text="Select the type of position being requested" [isTooltip]="true"></app-note>
            </div>
            <div class="radio-group radio-group--vertical">
              <label class="radio-option">
                <input type="radio" formControlName="positionRequested" value="RA">
                <span>Research Assistant (UG Student)</span>
              </label>
              <label class="radio-option">
                <input type="radio" formControlName="positionRequested" value="GRA">
                <span>Graduate Research Assistant (PG Student)</span>
              </label>
            </div>
            <app-validation-message [control]="form.get('positionRequested')"></app-validation-message>
          </div>

          <div class="form-field">
            <label class="form-label is-required">RA/GRA Application Type</label>
            <div class="radio-group radio-group--vertical">
              <label class="radio-option">
                <input type="radio" formControlName="applicationType" value="New">
                <span>New</span>
              </label>
              <label class="radio-option">
                <input type="radio" formControlName="applicationType" value="Renewal">
                <span>Renewal</span>
              </label>
            </div>
            <app-validation-message [control]="form.get('applicationType')"></app-validation-message>
          </div>
        </div>

        <!-- Right Column -->
        <div class="form-column">
          <div class="form-field">
            <label class="form-label is-required">Is this RA/GRA to be placed at:</label>
            <div class="radio-group radio-group--vertical">
              <label class="radio-option">
                <input type="radio" formControlName="placement" value="Research Project">
                <span>Research Project</span>
              </label>
              <label class="radio-option">
                <input type="radio" formControlName="placement" value="Research Cluster">
                <span>Research Cluster</span>
              </label>
            </div>
            <app-validation-message [control]="form.get('placement')"></app-validation-message>
          </div>

          <div class="form-field">
            <label class="form-label is-required">Year</label>
            <div class="radio-group radio-group--vertical">
              <label class="radio-option">
                <input type="radio" formControlName="year" value="Second Year">
                <span>Second Year</span>
              </label>
              <label class="radio-option">
                <input type="radio" formControlName="year" value="Third Year">
                <span>Third Year</span>
              </label>
            </div>
            <app-validation-message [control]="form.get('year')"></app-validation-message>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
