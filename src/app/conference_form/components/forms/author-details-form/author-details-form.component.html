<form [formGroup]="form" class="form-section">
  <div class="section-fields">
    <div class="costing-section">
      <h3 class="section-header">Co-Authors Information</h3>
      <div class="costing-content">

        <!-- Co-Authors Container -->
        <div class="research-subsection">
          <!-- APU Staff Co-Authors Red Box -->
          <div class="form-field disclaimer-field">
            <p class="disclaimer-text">
              <b style="color: var(--color-error-dark);">Please Select APU Staff Co-Authors</b>
            </p>
          </div>

          <!-- APU Student Co-Authors Red Box -->
          <div class="form-field disclaimer-field">
            <p class="disclaimer-text">
              <b style="color: var(--color-error-dark);">Please Select APU Student Co-Authors</b>
            </p>
          </div>

          <!-- Non-APU Co-Authors Red Box -->
          <div class="form-field disclaimer-field">
            <p class="disclaimer-text">
              <b style="color: var(--color-error-dark);">Please Input Non-APU Co-Authors</b>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</form>
