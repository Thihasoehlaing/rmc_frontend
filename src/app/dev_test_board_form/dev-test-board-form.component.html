<!-- Modal/Warning Page Builder - Block Based -->
<div class="modal-builder-container">
  <!-- Main Split Layout -->
  <div class="builder-split-layout" [class.fullscreen-preview]="isPreviewFullscreen()">
    <!-- Left Panel: Editor Controls -->
    <section class="editor-panel" *ngIf="!isPreviewFullscreen()">
      <!-- Modal Settings -->
      <app-custom-header title="Modal Settings"></app-custom-header>

      <form [formGroup]="editorForm" class="editor-form">
        <!-- Title -->
        <div class="form-field">
          <label for="title" class="form-label">Modal Title</label>
          <input
            id="title"
            type="text"
            class="input--text"
            formControlName="title"
            placeholder="e.g., Guidelines for Applicants"
          />
        </div>

        <!-- Modal Colors - Token Selection Only -->
        <div class="form-field">
          <label for="bgToken" class="form-label">Background Token</label>
          <app-searchable-dropdown
            id="bgToken"
            [options]="backgroundTokens"
            [isMulti]="false"
            formControlName="backgroundToken"
          ></app-searchable-dropdown>
        </div>

        <div class="form-field">
          <label for="textToken" class="form-label">Text Color Token</label>
          <app-searchable-dropdown
            id="textToken"
            [options]="colorTokens"
            [isMulti]="false"
            formControlName="textToken"
          ></app-searchable-dropdown>
        </div>

        <div class="form-field">
          <label for="btnToken" class="form-label">Button Color Token</label>
          <app-searchable-dropdown
            id="btnToken"
            [options]="buttonTokens"
            [isMulti]="false"
            formControlName="buttonToken"
          ></app-searchable-dropdown>
        </div>

        <div class="form-field">
          <label for="btnText" class="form-label">Button Text</label>
          <input
            id="btnText"
            type="text"
            class="input--text"
            formControlName="buttonText"
            placeholder="e.g., Close"
          />
        </div>
      </form>

      <!-- Content Blocks Section -->
      <app-custom-header title="Content Blocks"></app-custom-header>

      <!-- Add Block Buttons -->
      <div class="add-block-section">
        <p class="add-block-label">Add a new block:</p>
        <div class="block-buttons">
          <button class="btn btn-secondary btn-sm" (click)="addBlock('text')">
            + Text
          </button>
          <button class="btn btn-secondary btn-sm" (click)="addBlock('highlight')">
            + Highlight
          </button>
          <button class="btn btn-secondary btn-sm" (click)="addBlock('heading')">
            + Heading
          </button>
          <button class="btn btn-secondary btn-sm" (click)="addBlock('warning')">
            ⚠ Warning
          </button>
          <button class="btn btn-secondary btn-sm" (click)="addBlock('info')">
            ℹ Info
          </button>
        </div>
      </div>

      <!-- Existing Blocks -->
      <div class="blocks-list" *ngIf="modalConfig().blocks.length > 0">
        <div
          class="block-editor"
          *ngFor="let block of modalConfig().blocks; trackBy: trackByBlockId"
        >
          <div class="block-header">
            <span class="block-type">{{ block.type | titlecase }}</span>
            <button
              class="btn-remove"
              (click)="removeBlock(block.id)"
              type="button"
              title="Remove block"
            >
              ✕
            </button>
          </div>

          <form [formGroup]="blockForms.get(block.id)!" class="block-form">
            <!-- Content Input -->
            <div class="form-field">
              <label [for]="'content-' + block.id" class="form-label">
                Content
              </label>
              <textarea
                [id]="'content-' + block.id"
                class="input--textarea"
                formControlName="content"
                placeholder="Enter content..."
                rows="4"
              ></textarea>
            </div>

            <!-- Font Size Token (All Blocks) -->
            <div class="form-field">
              <label [for]="'fontSize-' + block.id" class="form-label">
                Font Size
              </label>
              <app-searchable-dropdown
                [id]="'fontSize-' + block.id"
                [options]="fontSizeTokens"
                [isMulti]="false"
                formControlName="fontSizeToken"
              ></app-searchable-dropdown>
            </div>

            <div class="form-field">
              <label [for]="'fontWeight-' + block.id" class="form-label">
                Font Weight
              </label>
              <app-searchable-dropdown
                [id]="'fontWeight-' + block.id"
                [options]="fontWeightTokens"
                [isMulti]="false"
                formControlName="fontWeightToken"
              ></app-searchable-dropdown>
            </div>

            <div class="form-field">
              <label [for]="'textColor-' + block.id" class="form-label">
                Text Color
              </label>
              <app-searchable-dropdown
                [id]="'textColor-' + block.id"
                [options]="colorTokens"
                [isMulti]="false"
                formControlName="textToken"
              ></app-searchable-dropdown>
            </div>

            <ng-container *ngIf="block.type === 'highlight'">
              <div class="form-field">
                <label [for]="'bg-' + block.id" class="form-label">
                  Background Token (Highlight Box)
                </label>
                <app-searchable-dropdown
                  [id]="'bg-' + block.id"
                  [options]="backgroundTokens"
                  [isMulti]="false"
                  formControlName="bgToken"
                ></app-searchable-dropdown>
              </div>
            </ng-container>

            <!-- Styling for Warning Box - Token Selection Only -->
            <ng-container *ngIf="block.type === 'warning'">
              <div class="form-field">
                <label [for]="'bg-' + block.id" class="form-label">
                  Background Token (Warning)
                </label>
                <app-searchable-dropdown
                  [id]="'bg-' + block.id"
                  [options]="warningBoxTokens"
                  [isMulti]="false"
                  formControlName="bgToken"
                ></app-searchable-dropdown>
              </div>
            </ng-container>

            <ng-container *ngIf="block.type === 'info'">
              <div class="form-field">
                <label [for]="'bg-' + block.id" class="form-label">
                  Background Token (Info)
                </label>
                <app-searchable-dropdown
                  [id]="'bg-' + block.id"
                  [options]="infoBoxTokens"
                  [isMulti]="false"
                  formControlName="bgToken"
                ></app-searchable-dropdown>
              </div>
            </ng-container>
          </form>
        </div>
      </div>

      <div class="empty-state" *ngIf="modalConfig().blocks.length === 0">
        <p>No blocks yet. Start by adding content blocks above.</p>
      </div>

      <!-- Export Button -->
      <button
        type="button"
        class="btn btn-primary"
        (click)="exportConfig()"
        style="width: 100%"
      >
        Export Configuration
      </button>
    </section>

    <!-- Right Panel: Live Preview -->
    <section class="preview-panel">
      <div class="preview-header">
        <app-custom-header title="Live Preview"></app-custom-header>
        <button
          class="btn-fullscreen"
          (click)="togglePreviewFullscreen()"
          type="button"
          [title]="isPreviewFullscreen() ? 'Exit Fullscreen' : 'Fullscreen'"
        >
          {{ isPreviewFullscreen() ? '⛶' : '⛶' }}
        </button>
      </div>

      <div class="preview-container">
        <!-- Modal Overlay & Container -->
        <div class="preview-modal-overlay">
          <div
            class="preview-modal-container"
            [style.background-color]="modalConfig().backgroundToken"
            [style.color]="modalConfig().textToken"
          >
            <!-- Modal Header -->
            <div class="preview-modal-header">
              <h2 class="preview-modal-title">{{ modalConfig().title }}</h2>
              <button class="btn-close">&times;</button>
            </div>

            <!-- Modal Body - Rendered Blocks -->
            <div class="preview-modal-body">
              <ng-container
                *ngFor="let block of modalConfig().blocks; trackBy: trackByBlockId"
              >
                <!-- Text Block -->
                <p
                  *ngIf="block.type === 'text'"
                  class="block-text"
                  [style.fontSize]="block.styling?.fontSizeToken"
                  [style.fontWeight]="block.styling?.fontWeightToken"
                  [style.color]="block.styling?.textToken"
                >
                  {{ block.content }}
                </p>

                <!-- Highlight Block (as Box) -->
                <div
                  *ngIf="block.type === 'highlight'"
                  class="block-highlight"
                  [style.background-color]="block.styling?.bgToken"
                  [style.color]="block.styling?.textToken"
                >
                  <div
                    class="highlight-content"
                    [style.fontSize]="block.styling?.fontSizeToken"
                    [style.fontWeight]="block.styling?.fontWeightToken"
                  >
                    {{ block.content }}
                  </div>
                </div>

                <!-- Heading Block -->
                <h3
                  *ngIf="block.type === 'heading'"
                  class="block-heading"
                  [style.fontSize]="block.styling?.fontSizeToken"
                  [style.fontWeight]="block.styling?.fontWeightToken"
                  [style.color]="block.styling?.textToken"
                >
                  {{ block.content }}
                </h3>

                <!-- Warning Box -->
                <div
                  *ngIf="block.type === 'warning'"
                  class="block-warning"
                  [style.background-color]="block.styling?.bgToken"
                  [style.color]="block.styling?.textToken"
                >
                  <span class="warning-icon">⚠</span>
                  <div
                    class="warning-content"
                    [style.fontSize]="block.styling?.fontSizeToken"
                    [style.fontWeight]="block.styling?.fontWeightToken"
                  >
                    {{ block.content }}
                  </div>
                </div>

                <!-- Info Box -->
                <div
                  *ngIf="block.type === 'info'"
                  class="block-info"
                  [style.background-color]="block.styling?.bgToken"
                  [style.color]="block.styling?.textToken"
                >
                  <span class="info-icon">ℹ</span>
                  <div
                    class="info-content"
                    [style.fontSize]="block.styling?.fontSizeToken"
                    [style.fontWeight]="block.styling?.fontWeightToken"
                  >
                    {{ block.content }}
                  </div>
                </div>
              </ng-container>

              <div
                class="preview-empty"
                *ngIf="modalConfig().blocks.length === 0"
              >
                <p>No blocks added yet. Add content blocks to see preview.</p>
              </div>
            </div>

            <!-- Modal Footer -->
            <div class="preview-modal-footer">
              <button
                class="btn btn-primary"
                [style.background-color]="modalConfig().buttonToken"
              >
                {{ modalConfig().buttonText }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
