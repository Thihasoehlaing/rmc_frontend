<main class="settings-page">
  <app-admin-settings-page-header
    title="Dropdown Management"
    description="Manage dropdown options used in applications and review forms."
  />
  <app-settings-panel title="Form areas" [count]="sections().length">
    @if (loading()) {
      <app-state title="Loading dropdown sections" icon="hourglass_empty" />
    } @else {
      <div class="settings-module-grid">
        @for (section of sections(); track section.id) {
          <button
            type="button"
            class="settings-module-link"
            [disabled]="!section.route"
            (click)="openSection(section)"
          >
            <span class="settings-module-icon material-icons" aria-hidden="true">{{
              section.icon
            }}</span>
            <div>
              <strong>{{ section.title }}</strong>
              <p>{{ section.description }}</p>
              <p>{{ section.categories.join(' · ') }}</p>
            </div>
            <span class="material-icons settings-module-arrow" aria-hidden="true"
              >arrow_forward</span
            >
          </button>
        } @empty {
          <app-state
            title="No active dropdown sections"
            description="Activate a form in Form Settings to show its dropdown management section."
          />
        }
      </div>
    }
  </app-settings-panel>
</main>
