<main class="settings-page">
  <app-admin-settings-page-header
    title="Form Setting"
    description="View all application forms currently registered in the system."
  ></app-admin-settings-page-header>

  <app-search-toolbar
    [query]="searchDraft()"
    (queryChange)="searchDraft.set($event)"
    (search)="onSearch(searchDraft())"
    (reset)="resetFilters()"
    placeholder="Search form code or name"
  >
    <div class="settings-filter">
      <app-dropdown
        [label]="'Status'"
        [options]="[
          { value: 'all', label: 'All' },
          { value: 'active', label: 'Active' },
          { value: 'inactive', label: 'Inactive' },
        ]"
        [ngModel]="statusDraft()"
        (ngModelChange)="statusDraft.set($event)"
        [disabled]="loading()"
      />
    </div>
  </app-search-toolbar>

  <app-settings-panel title="Forms" [count]="filteredForms().length" [flush]="true">
    @if (loading()) {
      <app-state title="Loading settings" icon="hourglass_empty" />
    } @else if (loadFailed()) {
      <app-state
        [title]="'Unable to load forms'"
        [description]="'Check the API connection and try again.'"
        icon="inbox"
        [error]="true"
        ><app-action-button
          [label]="'Try Again'"
          type="primary"
          size="small"
          (clicked)="loadForms()"
      /></app-state>
    } @else if (pagedForms().length === 0) {
      <app-state
        [title]="'No forms found'"
        [description]="'There are no forms matching the selected filters.'"
        icon="inbox"
      ></app-state>
    } @else {
      <app-data-table
        [dense]="true"
        [embedded]="true"
        class="form-setting-options-table"
        [columns]="columns"
        [rows]="pagedForms()"
        [rowTrackFn]="rowTrackFn"
      >
        <ng-template #rowTemplate let-row let-index="index">
          <tr>
            <td>{{ rowNumber(index) }}</td>
            <td>
              <strong class="form-name">{{ row.form_name }}</strong>
            </td>
            <td>
              <app-status-badge [intent]="row.is_active ? 'success' : 'warning'">
                {{ row.is_active ? 'Active' : 'Inactive' }}
              </app-status-badge>
            </td>
          </tr>
        </ng-template>
      </app-data-table>
    }
  </app-settings-panel>

  @if (!loading() && !loadFailed()) {
    <footer class="form-setting-pagination-panel">
      <app-pagination
        [currentPage]="page()"
        [totalPages]="totalPages()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="pageSizeOptions"
        [totalItems]="filteredForms().length"
        [itemCount]="pagedForms().length"
        itemLabel="forms"
        (pageChange)="page.set($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      ></app-pagination>
    </footer>
  }
</main>
