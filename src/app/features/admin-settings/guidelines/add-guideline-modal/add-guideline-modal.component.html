<app-dialog
  [isOpen]="true"
  [title]="editId ? 'Edit Guideline' : 'Add Guideline'"
  size="large"
  width="1040px"
  (close)="onClose()"
>
  <div class="guideline-editor-body">
    <section
      class="guideline-panel guideline-panel--meta"
      aria-labelledby="guideline-details-title"
    >
      <div class="section-heading">
        <h3 id="guideline-details-title" class="section-title">Guideline Details</h3>
      </div>

      <div class="section-fields row--2 guideline-meta-grid">
        <div class="form-field">
          <label for="guideline-title" class="form-label">Guideline Title</label>
          <input
            id="guideline-title"
            type="text"
            class="input--text"
            [ngModel]="guidelineConfig().title"
            (ngModelChange)="onTitleChange($event)"
            [disabled]="isSaving"
          />
        </div>

        <div class="form-field">
          <label for="guideline-form" class="form-label">Form</label>
          <select
            id="guideline-form"
            class="input--select"
            [ngModel]="guidelineConfig().formId?.toString() ?? ''"
            (ngModelChange)="onFormChange($event)"
            [disabled]="isSaving"
          >
            <option value="">Select a form</option>
            @for (form of forms(); track form.id) {
              <option [value]="form.id.toString()">{{ form.form_name }}</option>
            }
          </select>
        </div>
      </div>
    </section>

    <section
      class="guideline-panel guideline-panel--editor"
      aria-labelledby="guideline-editor-title"
    >
      <div class="section-heading">
        <h3 id="guideline-editor-title" class="section-title">Guideline Editor</h3>
      </div>

      <app-text-editor
        label="Guideline content"
        placeholder="Write the guideline content..."
        [required]="true"
        [showCounter]="false"
        minHeight="360px"
        [toolbarOptions]="editorToolbarOptions"
        [ngModel]="guidelineContent()"
        (ngModelChange)="onContentChange($event)"
      ></app-text-editor>
    </section>

    <section
      class="guideline-panel guideline-panel--preview"
      aria-labelledby="guideline-preview-title"
    >
      <div class="section-heading">
        <h3 id="guideline-preview-title" class="section-title">Preview</h3>
      </div>

      <div class="preview-launcher">
        <div class="preview-launcher__content">
          <span class="preview-launcher__icon material-icons" aria-hidden="true">visibility</span>
          <div>
            <p class="preview-launcher__title">Final guideline popup</p>
            <p class="preview-launcher__text">{{ guidelineConfig().title }}</p>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="openPreview()"
          [disabled]="isContentEmpty()"
        >
          Preview
        </button>
      </div>
    </section>
  </div>

  <div dialog-footer class="guideline-dialog-actions">
    <button type="button" (click)="onClose()" class="btn btn-secondary" [disabled]="isSaving">
      Cancel
    </button>
    <button
      type="button"
      (click)="onSave()"
      class="btn btn-primary"
      [disabled]="isSaving || isSaveDisabled()"
    >
      {{ isSaving ? 'Saving...' : 'Save Guideline' }}
    </button>
  </div>
</app-dialog>
<app-guidelines-modal
  #previewModal
  [title]="guidelineConfig().title"
  [contentOverride]="guidelineContent()"
></app-guidelines-modal>
