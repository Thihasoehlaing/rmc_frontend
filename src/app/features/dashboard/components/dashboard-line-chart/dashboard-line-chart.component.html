@if (plotPoints().length) {
  <div class="line-chart">
    <svg viewBox="0 0 720 338" role="img" aria-label="Date range trend chart">
      @for (line of gridLines(); track line.y) {
        <line class="grid-line" [attr.x1]="left" [attr.x2]="plotRight" [attr.y1]="line.y" [attr.y2]="line.y"></line>
        <text class="axis-label axis-label--y" [attr.x]="left - 10" [attr.y]="line.y + 4">{{ line.label }}</text>
      }

      <polyline class="trend-area" [attr.points]="areaPolygon()"></polyline>
      <polyline class="trend-line" [attr.points]="polyline()"></polyline>

      @for (point of plotPoints(); track point.key) {
        <line
          class="point-guide"
          [attr.x1]="point.x"
          [attr.x2]="point.x"
          [attr.y1]="point.y"
          [attr.y2]="plotBottom"
        ></line>
        <circle
          class="trend-point"
          [attr.cx]="point.x"
          [attr.cy]="point.y"
          r="5"
          tabindex="0"
          [attr.aria-label]="point.label + ': ' + point.formattedValue"
          (mouseenter)="activePoint.set(point)"
          (mouseleave)="activePoint.set(null)"
          (focus)="activePoint.set(point)"
          (blur)="activePoint.set(null)"
        ></circle>
        <text class="axis-label axis-label--x" [attr.x]="point.x" [attr.y]="point.axisLabelY">
          <tspan [attr.x]="point.x">{{ point.axisLabel }}</tspan>
          @if (point.axisDetail) {
            <tspan [attr.x]="point.x" dy="14">{{ point.axisDetail }}</tspan>
          }
        </text>
      }
    </svg>
    <app-chart-tooltip
      [visible]="activePoint() !== null"
      [animate]="false"
      color="var(--color-primary)"
      [label]="activePoint()?.label ?? ''"
      [value]="activePoint()?.formattedValue ?? ''"
      [detail]="totalLabel"
    />
  </div>
} @else {
  <div class="line-chart-empty">
    <span class="material-icons">show_chart</span>
    <span>{{ emptyLabel }}</span>
  </div>
}
