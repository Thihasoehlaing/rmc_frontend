@if (plotPoints().length) {
  <div class="line-chart">
    <div class="line-chart__summary">
      <span>Chart total</span>
      <strong>{{ formatValue(total()) }}</strong>
    </div>
    <svg viewBox="0 0 720 338" role="img" aria-label="Date range trend chart">
      @for (line of gridLines(); track line.y) {
        <line class="grid-line" x1="58" x2="698" [attr.y1]="line.y" [attr.y2]="line.y"></line>
        <text class="axis-label axis-label--y" x="48" [attr.y]="line.y + 4">{{ line.label }}</text>
      }

      <polyline class="trend-area" [attr.points]="polyline() + ' 698,218 58,218'"></polyline>
      <polyline class="trend-line" [attr.points]="polyline()"></polyline>

      @for (point of plotPoints(); track point.key) {
        <line
          class="point-guide"
          [attr.x1]="point.x"
          [attr.x2]="point.x"
          [attr.y1]="point.y"
          y2="218"
        ></line>
        <circle
          class="trend-point"
          [attr.cx]="point.x"
          [attr.cy]="point.y"
          r="5"
          tabindex="0"
          [attr.aria-label]="point.label + ': ' + point.formattedValue"
        >
          <title>{{ point.label }}: {{ point.formattedValue }}</title>
        </circle>
        <text class="axis-label axis-label--x" [attr.x]="point.x" [attr.y]="point.axisLabelY">
          <tspan [attr.x]="point.x">{{ point.axisLabel }}</tspan>
          @if (point.axisDetail) {
            <tspan [attr.x]="point.x" dy="14">{{ point.axisDetail }}</tspan>
          }
        </text>
      }
    </svg>
  </div>
} @else {
  <div class="line-chart-empty">
    <span class="material-icons">show_chart</span>
    <span>{{ emptyLabel }}</span>
  </div>
}
