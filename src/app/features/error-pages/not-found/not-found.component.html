<main class="error-page error-page--not-found">
  <section class="error-card" aria-labelledby="not-found-title">
    <div class="error-card__visual" aria-hidden="true">
      <span class="material-icons">travel_explore</span>
    </div>

    <div class="error-card__content">
      <span class="error-card__eyebrow">404 · Page not found</span>
      <h1 id="not-found-title">We couldn’t find this page</h1>
      <p>
        The link may be outdated, the page may have moved, or the address may have been typed
        incorrectly.
      </p>
    </div>

    <div class="error-card__actions">
      <a class="btn btn-primary" routerLink="/dashboard">
        <span class="material-icons">dashboard</span>
        Go to Dashboard
      </a>
    </div>
  </section>
</main>
