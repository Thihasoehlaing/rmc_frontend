<main class="Journal-settings">
  <app-settings-page-header [title]="'Journal Guidelines Settings'" [description]="''" eyebrow="Workspace"></app-settings-page-header>

  <section class="settings-container card">
    <div class="card__content">
      <!-- Action Buttons -->
      <div class="action-buttons">
        <app-action-button [label]="'+ Add Guideline'" type="primary" size="small" [ariaLabel]="'Add guideline'" (clicked)="openAddModal()" buttonType="button" />
        <app-action-button [label]="'Delete'" type="danger" size="small" [disabled]="!hasSelectedCheckboxes" [ariaLabel]="'Delete selected guidelines'" (clicked)="deleteSelected()" buttonType="button" />
      </div>

      <!-- Search, Filter, and Sort Controls -->
      <app-search-toolbar [query]="searchQuery()" (queryChange)="onSearchInput($event)" (search)="onSearchInput(searchQuery())" (reset)="onSearchInput('')" placeholder="Search options"><app-dropdown [options]="standardOptions1()" [ngModel]="filterStatus()" (ngModelChange)="onFilterChange($event)" ariaLabel="Filter by status" class="filter-select" /></app-search-toolbar>

      <!-- Options Table -->
      @if (filteredGuidelines().length > 0) {
        <app-data-table [dense]="true"
          [columns]="columns"
          [rows]="paginatedGuidelines()"
          [sortColumn]="sortBy()"
          [sortDirection]="sortDirection()"
          (sortChange)="onSortChange($any($event))"
        >
          <ng-template #rowTemplate let-g
            ><tr>
              <td>
                <input class="input--checkbox"
                  type="checkbox"
                  [checked]="isOptionSelected(g.id)"
                  (change)="toggleCheckbox(g.id)"
                  [attr.aria-label]="'Select ' + g.title"
                />
              </td>
              <td>{{ g.title }}</td>
              <td>{{ g.formName }}</td>
              <td>{{ g.sectionName }}</td>
              <td class="option-date" [title]="g.content">{{ g.content }}</td>
              <td>
                <span class="status-badge" [class]="'status-' + (g.status | lowercase)">{{
                  g.status
                }}</span>
              </td>
              <td>
                <div class="data-table__actions">
                  <app-action-button [label]="'Edit'" type="primary" size="small" [icon]="'edit'" [iconOnly]="true" [title]="'Edit'" (clicked)="editGuideline(g)" buttonType="button" /><app-action-button [label]="'Delete'" type="primary" size="small" [icon]="'delete_outline'" [iconOnly]="true" [title]="'Delete'" (clicked)="deleteSelected(g.id)" buttonType="button" />
                </div>
              </td></tr
          ></ng-template>
        </app-data-table>

        <div class="table-footer">
          <app-pagination
            [currentPage]="guidelinePage()"
            [totalPages]="guidelineTotalPages()"
            [pageSize]="guidelinePageSize()"
            [pageSizeOptions]="guidelinePageSizeOptions"
            [totalItems]="filteredGuidelines().length"
            [itemCount]="paginatedGuidelines().length"
            itemLabel="guidelines"
            (pageChange)="onGuidelinePageChange($event)"
            (pageSizeChange)="onGuidelinePageSizeChange($event)"
          >
          </app-pagination>
        </div>
      } @else {
        <div class="empty-state">
          <p>No guidelines found. Click "Add Guideline" to create one.</p>
        </div>
      }
    </div>
  </section>

  <!-- Modal Overlay -->
  @if (isModalOpen()) {
    <div class="modal-overlay" (click)="closeModal()"></div>

    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">{{ editingId() ? 'Edit' : 'Add' }} Guideline</h3>
        <button
          type="button"
          class="modal-close-btn"
          (click)="closeModal()"
          aria-label="Close modal"
        >
          ✕
        </button>
      </div>

      <form [formGroup]="form" class="modal-body">
        <div class="form-field">
          <label class="form-label">Guideline Title <span class="required">*</span></label>
          <input appInput
            type="text"
            class="input--text"
            formControlName="title"
            placeholder="Enter title"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Form Name <span class="required">*</span></label>
          <input appInput
            type="text"
            class="input--text"
            formControlName="formName"
            placeholder="e.g. Journal Publication Form"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Section Name <span class="required">*</span></label>
          <input appInput
            type="text"
            class="input--text"
            formControlName="sectionName"
            placeholder="e.g. General"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Content <span class="required">*</span></label>
          <textarea appInput
            class="input--textarea"
            formControlName="content"
            rows="6"
            placeholder="Guideline details... HTML supported."
            (input)="autoExpandTextarea($event)"
          ></textarea>
        </div>

        <div class="form-field">
          <label class="form-label">Status</label>
          <app-dropdown [options]="standardOptions0()" formControlName="status" ariaLabel="Status" class="" />
        </div>

        <div class="modal-actions">
          <app-action-button [label]="'Cancel'" type="primary" size="small" (clicked)="closeModal()" buttonType="button" />
          <app-action-button [label]="'Save'" type="primary" size="small" [disabled]="form.invalid" (clicked)="save()" buttonType="button" />
        </div>
      </form>
    </div>
  }
</main>
