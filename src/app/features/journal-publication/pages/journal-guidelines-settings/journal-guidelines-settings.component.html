<main class="Journal-settings">
  <header class="settings-header">
    <h1>Journal Guidelines Settings</h1>
  </header>

  <section class="settings-container card">
    <div class="card__content">
      <!-- Action Buttons -->
      <div class="action-buttons">
        <button
          type="button"
          class="btn btn-primary"
          (click)="openAddModal()"
          aria-label="Add guideline"
        >
          + Add Guideline
        </button>
        <button
          type="button"
          class="btn btn-danger"
          [disabled]="!hasSelectedCheckboxes"
          (click)="deleteSelected()"
          aria-label="Delete selected guidelines"
        >
          Delete
        </button>
      </div>

      <!-- Search, Filter, and Sort Controls -->
      <div class="controls-section">
        <div class="search-box">
          <input
            type="text"
            class="input--text search-input"
            placeholder="Search guidelines..."
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            aria-label="Search guidelines"
          />
        </div>

        <div class="filter-sort-group">
          <select
            class="input--select filter-select"
            [value]="filterStatus()"
            (change)="onFilterChange($event)"
            aria-label="Filter by status"
          >
            <option value="All">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <!-- Options Table -->
      @if (filteredGuidelines().length > 0) {
        <app-data-table
          [columns]="columns"
          [rows]="paginatedGuidelines()"
          [sortColumn]="sortBy()"
          [sortDirection]="sortDirection()"
          (sortChange)="onSortChange($any($event))"
        >
          <ng-template #rowTemplate let-g
            ><tr>
              <td>
                <input
                  type="checkbox"
                  [checked]="isOptionSelected(g.id)"
                  (change)="toggleCheckbox(g.id)"
                  [attr.aria-label]="'Select ' + g.title"
                />
              </td>
              <td>{{ g.title }}</td>
              <td>{{ g.formName }}</td>
              <td>{{ g.sectionName }}</td>
              <td class="option-date" [title]="g.content">{{ g.content }}</td>
              <td>
                <span class="status-badge" [class]="'status-' + (g.status | lowercase)">{{
                  g.status
                }}</span>
              </td>
              <td>
                <div class="data-table__actions">
                  <button
                    type="button"
                    class="btn-icon btn-icon--edit"
                    (click)="editGuideline(g)"
                    title="Edit"
                  >
                    <app-table-action-icon action="edit"></app-table-action-icon></button
                  ><button
                    type="button"
                    class="btn-icon btn-icon--delete"
                    (click)="deleteSelected(g.id)"
                    title="Delete"
                  >
                    <app-table-action-icon action="delete"></app-table-action-icon>
                  </button>
                </div>
              </td></tr
          ></ng-template>
        </app-data-table>

        <div class="table-footer">
          <app-pagination
            [currentPage]="guidelinePage()"
            [totalPages]="guidelineTotalPages()"
            [pageSize]="guidelinePageSize()"
            [pageSizeOptions]="guidelinePageSizeOptions"
            [totalItems]="filteredGuidelines().length"
            [itemCount]="paginatedGuidelines().length"
            itemLabel="guidelines"
            (pageChange)="onGuidelinePageChange($event)"
            (pageSizeChange)="onGuidelinePageSizeChange($event)"
          >
          </app-pagination>
        </div>
      } @else {
        <div class="empty-state">
          <p>No guidelines found. Click "Add Guideline" to create one.</p>
        </div>
      }
    </div>
  </section>

  <!-- Modal Overlay -->
  @if (isModalOpen()) {
    <div class="modal-overlay" (click)="closeModal()"></div>

    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">{{ editingId() ? 'Edit' : 'Add' }} Guideline</h3>
        <button
          type="button"
          class="modal-close-btn"
          (click)="closeModal()"
          aria-label="Close modal"
        >
          ✕
        </button>
      </div>

      <form [formGroup]="form" class="modal-body">
        <div class="form-field">
          <label class="form-label">Guideline Title <span class="required">*</span></label>
          <input
            type="text"
            class="input--text"
            formControlName="title"
            placeholder="Enter title"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Form Name <span class="required">*</span></label>
          <input
            type="text"
            class="input--text"
            formControlName="formName"
            placeholder="e.g. Journal Publication Form"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Section Name <span class="required">*</span></label>
          <input
            type="text"
            class="input--text"
            formControlName="sectionName"
            placeholder="e.g. General"
          />
        </div>

        <div class="form-field">
          <label class="form-label">Content <span class="required">*</span></label>
          <textarea
            class="input--textarea"
            formControlName="content"
            rows="6"
            placeholder="Guideline details... HTML supported."
            (input)="autoExpandTextarea($event)"
          ></textarea>
        </div>

        <div class="form-field">
          <label class="form-label">Status</label>
          <select class="input--select" formControlName="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" (click)="closeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            Save
          </button>
        </div>
      </form>
    </div>
  }
</main>
