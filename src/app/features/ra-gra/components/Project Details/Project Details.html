<form [formGroup]="form" class="form-section">
  <!-- Section 1: Applicant Details -->
  <div class="card">
    <div class="card__header">
      <h2 class="card__title">Applicant Details</h2>
    </div>
    <div class="card__content section-fields">
      <div class="row row--2">
        <div class="form-field">
          <label class="form-label">Applicant Name</label>
          <input type="text" class="input--text input--soft-readonly" [value]="auth.currentUser()?.name || ''" readonly>
        </div>
        <div class="form-field">
          <label class="form-label is-required">School Name</label>
          <input type="text" class="input--text input--soft-readonly" [value]="auth.currentUser()?.department || ''" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- Section 2: Project / Research Cluster Details -->
  <div class="card">
    <div class="card__header">
      <h2 class="card__title">Project / Research Cluster Details</h2>
    </div>
    <div class="card__content section-fields">
      
      <!-- Position Requested -->
      <div class="form-field">
        <label class="form-label is-required">Position Requested</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="positionRequested" value="RA">
            <span>Research Assistant (UG Student)</span>
          </label>
          <label class="radio-option">
            <input type="radio" formControlName="positionRequested" value="GRA">
            <span>Graduate Research Assistant (PG Student)</span>
          </label>
        </div>
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('positionRequested')"
          fieldName="Position">
        </app-validation-message>
      </div>

      <!-- Is this RA/GRA to be placed at -->
      <div class="form-field">
        <label class="form-label is-required">Is this RA/GRA to be placed at</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="placement" value="Research Project">
            <span>Research Project</span>
          </label>
          <label class="radio-option" [class.radio-option--disabled]="isResearchClusterDisabled">
            <input 
              type="radio" 
              formControlName="placement" 
              value="Research Cluster"
              [disabled]="isResearchClusterDisabled">
            <span>Research Cluster</span>
          </label>
        </div>
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('placement')"
          fieldName="Placement">
        </app-validation-message>
      </div>

      <!-- RA/GRA Application Type -->
      <div class="form-field">
        <label class="form-label is-required">RA/GRA Application Type</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="applicationType" value="New">
            <span>New</span>
          </label>
          <label class="radio-option">
            <input type="radio" formControlName="applicationType" value="Renewal">
            <span>Renewal</span>
          </label>
        </div>
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('applicationType')"
          fieldName="Application type">
        </app-validation-message>
      </div>

      <!-- Year -->
      <div class="form-field">
        <label class="form-label is-required">Year</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" formControlName="year" value="Second Year">
            <span>Second Year</span>
          </label>
          <label class="radio-option">
            <input type="radio" formControlName="year" value="Third Year">
            <span>Third Year</span>
          </label>
        </div>
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('year')"
          fieldName="Year">
        </app-validation-message>
      </div>

      <app-note 
        text="Research Assistants (UG Students) can only be placed under Research Projects." 
        [isTooltip]="false">
      </app-note>
    </div>
  </div>

  <!-- Section 3: Research Project Details (Conditional) -->
  <div class="card" *ngIf="showResearchProjectDetails">
    <div class="card__header">
      <h2 class="card__title">Research Project Details</h2>
    </div>
    <div class="card__content section-fields">
      
      <!-- Row 1: Account Code, Select Vote, Category of Grant -->
      <div class="row row--3">
        <div class="form-field">
          <label class="form-label is-required">Account Code</label>
          <select 
            formControlName="accountCode" 
            class="input--select"
            [class.is-invalid]="form.get('accountCode')?.invalid && form.get('accountCode')?.touched">
            <option *ngFor="let opt of accountCodeOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('accountCode')"
            fieldName="Account Code">
          </app-validation-message>
        </div>

        <div class="form-field">
          <label class="form-label is-required">Select Vote</label>
          <select 
            formControlName="selectVote" 
            class="input--select"
            [class.is-invalid]="form.get('selectVote')?.invalid && form.get('selectVote')?.touched">
            <option *ngFor="let opt of voteOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('selectVote')"
            fieldName="Vote">
          </app-validation-message>
        </div>

        <div class="form-field">
          <label class="form-label is-required">Category of Grant</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" formControlName="categoryOfGrant" value="Internal Grant">
              <span>Internal Grant</span>
            </label>
            <label class="radio-option">
              <input type="radio" formControlName="categoryOfGrant" value="External Grant">
              <span>External Grant</span>
            </label>
          </div>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('categoryOfGrant')"
            fieldName="Category of Grant">
          </app-validation-message>
        </div>
      </div>

      <!-- Row 2: Research Title -->
      <div class="form-field">
        <label class="form-label is-required">Research Title</label>
        <input 
          type="text" 
          class="input--text" 
          formControlName="researchTitle"
          placeholder="Enter research title"
          [class.is-invalid]="form.get('researchTitle')?.invalid && form.get('researchTitle')?.touched">
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('researchTitle')"
          fieldName="Research Title">
        </app-validation-message>
      </div>

      <!-- Row 3: Project Start Date, Project End Date, Research Grant/Project Funder -->
      <div class="row row--3">
        <div class="form-field">
          <label class="form-label is-required">Project Start Date</label>
          <input 
            type="date" 
            class="input--text" 
            formControlName="projectStartDate"
            [class.is-invalid]="form.get('projectStartDate')?.invalid && form.get('projectStartDate')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('projectStartDate')"
            fieldName="Project Start Date">
          </app-validation-message>
        </div>

        <div class="form-field">
          <label class="form-label is-required">Project End Date</label>
          <input 
            type="date" 
            class="input--text" 
            formControlName="projectEndDate"
            [class.is-invalid]="form.get('projectEndDate')?.invalid && form.get('projectEndDate')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('projectEndDate')"
            fieldName="Project End Date">
          </app-validation-message>
        </div>

        <div class="form-field">
          <label class="form-label is-required">Research Grant/Project Funder</label>
          <input 
            type="text" 
            class="input--text" 
            formControlName="researchGrantFunder"
            placeholder="Enter funder name"
            [class.input--soft-readonly]="form.get('categoryOfGrant')?.value === 'Internal Grant'"
            [class.is-invalid]="form.get('researchGrantFunder')?.invalid && form.get('researchGrantFunder')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('researchGrantFunder')"
            fieldName="Research Grant/Project Funder">
          </app-validation-message>
        </div>
      </div>

    </div>
  </div>

  <!-- Section 4: Research Cluster Details (Conditional) -->
  <div class="card" *ngIf="showResearchClusterDetails">
    <div class="card__header">
      <h2 class="card__title">Research Cluster Details</h2>
    </div>
    <div class="card__content section-fields">
      
      <div class="row row--2">
        <!-- Select Research Cluster/Research Centre -->
        <div class="form-field">
          <label class="form-label is-required">Select Research Cluster/Research Centre</label>
          <select 
            formControlName="researchCluster" 
            class="input--select"
            [class.is-invalid]="form.get('researchCluster')?.invalid && form.get('researchCluster')?.touched">
            <option *ngFor="let opt of researchClusterOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('researchCluster')"
            fieldName="Research Cluster/Research Centre">
          </app-validation-message>
        </div>

        <!-- How many current active RA/GRA in the research cluster -->
        <div class="form-field">
          <label class="form-label is-required">How many current active RA/GRA in the research cluster?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" formControlName="activeRaGraCount" value="1">
              <span>1</span>
            </label>
            <label class="radio-option">
              <input type="radio" formControlName="activeRaGraCount" value="2">
              <span>2</span>
            </label>
            <label class="radio-option">
              <input type="radio" formControlName="activeRaGraCount" value="3">
              <span>3</span>
            </label>
          </div>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('activeRaGraCount')"
            fieldName="Active RA/GRA count">
          </app-validation-message>
        </div>
      </div>

    </div>
  </div>
</form>
