<form [formGroup]="form" class="form-section">

  <!-- ── Student Details Card ──────────────────────────────────── -->
  <div class="card">
    <div class="card__header">
      <h2 class="card__title">Student Details</h2>
    </div>
    <div class="card__content section-fields">
      <div class="row row--2">

        <!-- LEFT COLUMN -->

        <!-- Asia Pacific University of Technology & Innovation Student ID -->
        <div class="form-field">
          <label class="form-label is-required">Asia Pacific University of Technology & Innovation Student ID</label>
          <input
            type="text"
            class="input--text"
            formControlName="studentId"
            placeholder="Enter APU student ID"
            [class.is-invalid]="form.get('studentId')?.invalid && form.get('studentId')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('studentId')"
            fieldName="Student ID">
          </app-validation-message>
        </div>

        <!-- Program Title (GRA only) -->
        <div class="form-field" *ngIf="positionRequested === 'GRA'">
          <label class="form-label is-required">Program Title</label>
          <select
            class="input--select"
            formControlName="programTitle"
            [class.is-invalid]="form.get('programTitle')?.invalid && form.get('programTitle')?.touched">
            <option *ngFor="let opt of programOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-note text="For GRA (PG Student) only" [isTooltip]="false"></app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('programTitle')"
            fieldName="Program Title">
          </app-validation-message>
        </div>

        <!-- Student Name -->
        <div class="form-field">
          <label class="form-label is-required">Student Name (As per IC/Passport)</label>
          <input
            type="text"
            class="input--text"
            formControlName="studentName"
            placeholder="As per IC/Passport"
            [class.is-invalid]="form.get('studentName')?.invalid && form.get('studentName')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('studentName')"
            fieldName="Student Name">
          </app-validation-message>
        </div>

        <!-- Nationality -->
        <div class="form-field">
          <label class="form-label is-required">Nationality</label>
          <select
            class="input--select"
            formControlName="nationality"
            [class.is-invalid]="form.get('nationality')?.invalid && form.get('nationality')?.touched">
            <option *ngFor="let opt of nationalityOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('nationality')"
            fieldName="Nationality">
          </app-validation-message>
        </div>

        <!-- Student Personal Email -->
        <div class="form-field">
          <label class="form-label is-required">Student Personal Email Address</label>
          <input
            type="email"
            class="input--text"
            formControlName="personalEmail"
            placeholder="personal@example.com"
            [class.is-invalid]="form.get('personalEmail')?.invalid && form.get('personalEmail')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('personalEmail')"
            fieldName="Personal Email">
          </app-validation-message>
        </div>

        <!-- NRIC / Passport -->
        <div class="form-field">
          <label class="form-label is-required">NRIC / Passport</label>
          <input
            type="text"
            class="input--text"
            formControlName="nricPassport"
            placeholder="Enter NRIC or Passport number"
            [class.is-invalid]="form.get('nricPassport')?.invalid && form.get('nricPassport')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('nricPassport')"
            fieldName="NRIC / Passport">
          </app-validation-message>
        </div>

        <!-- Student Residential Address -->
        <div class="form-field">
          <label class="form-label is-required">Student Residential Address</label>
          <input
            type="text"
            class="input--text"
            formControlName="residentialAddress"
            placeholder="Enter full residential address"
            [class.is-invalid]="form.get('residentialAddress')?.invalid && form.get('residentialAddress')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('residentialAddress')"
            fieldName="Residential Address">
          </app-validation-message>
        </div>

        <!-- Student APU Email -->
        <div class="form-field">
          <label class="form-label is-required">Student APU Email Address</label>
          <input
            type="email"
            class="input--text"
            formControlName="apuEmail"
            placeholder="student@apu.edu.my"
            [class.is-invalid]="form.get('apuEmail')?.invalid && form.get('apuEmail')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('apuEmail')"
            fieldName="APU Email">
          </app-validation-message>
        </div>

        <!-- RIGHT COLUMN (continues naturally in the grid) -->

        <!-- Student Phone Number -->
        <div class="form-field">
          <label class="form-label is-required">Student Phone Number</label>
          <input
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            class="input--text"
            formControlName="phoneNumber"
            placeholder="Enter phone number"
            [class.is-invalid]="form.get('phoneNumber')?.invalid && form.get('phoneNumber')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('phoneNumber')"
            fieldName="Phone Number">
          </app-validation-message>
        </div>

        <!-- Student Visa Expiry Date -->
        <div class="form-field">
          <label class="form-label">Student Visa Expiry Date (if international student)</label>
          <input
            type="date"
            class="input--text"
            formControlName="visaExpiryDate">
          <app-note text="For international students only" [isTooltip]="false"></app-note>
        </div>

      </div>

      <!-- Job Duties (Full Width) -->
      <div class="form-field">
        <label class="form-label is-required">Job Duties</label>
        <textarea
          class="input--textarea"
          formControlName="jobDuties"
          rows="6"
          maxlength="1000"
          placeholder="Describe the RA/GRA responsibilities for inclusion in the HR offer letter..."
          [class.is-invalid]="form.get('jobDuties')?.invalid && form.get('jobDuties')?.touched"></textarea>
        <app-character-counter
          [current]="form.get('jobDuties')?.value?.length || 0"
          [max]="1000">
        </app-character-counter>
        <app-validation-message 
          class="form-validation-note--error"
          [control]="form.get('jobDuties')"
          fieldName="Job Duties">
        </app-validation-message>
      </div>
    </div>
  </div>
  <!-- /Student Details Card -->

  <!-- ── Appointment & Compensation Card ──────────────────────────────────── -->
  <div class="card">
    <div class="card__header">
      <h2 class="card__title">Appointment & Compensation</h2>
    </div>
    <div class="card__content section-fields">
      <div class="row row--2">

        <!-- Appointment Commencement Date -->
        <div class="form-field">
          <label class="form-label is-required">Appointment Commencement Date</label>
          <input
            type="date"
            class="input--text"
            formControlName="commencementDate"
            [class.is-invalid]="form.get('commencementDate')?.invalid && form.get('commencementDate')?.touched">
          <app-note
            text="Appointment Commencement Date must be after the Project Start Date."
            [isTooltip]="false">
          </app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('commencementDate')"
            fieldName="Commencement Date">
          </app-validation-message>
        </div>

        <!-- Appointment End Date -->
        <div class="form-field">
          <label class="form-label is-required">Appointment End Date</label>
          <input
            type="date"
            class="input--text"
            formControlName="appointmentEndDate"
            [class.is-invalid]="form.get('appointmentEndDate')?.invalid && form.get('appointmentEndDate')?.touched">
          <app-note
            text="Appointment End Date cannot be later than the Visa End Date or Project End Date."
            [isTooltip]="false">
          </app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('appointmentEndDate')"
            fieldName="Appointment End Date">
          </app-validation-message>
        </div>

        <!-- Appointment Duration (Days) -->
        <div class="form-field">
          <label class="form-label is-required">Appointment Duration (Days)</label>
          <input
            type="number"
            class="input--text"
            formControlName="durationDays"
            min="1"
            placeholder="Enter duration in days"
            [class.is-invalid]="form.get('durationDays')?.invalid && form.get('durationDays')?.touched">
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('durationDays')"
            fieldName="Duration">
          </app-validation-message>
        </div>

        <!-- Second Reporting Person -->
        <div class="form-field">
          <label class="form-label is-required">Second Reporting Person</label>
          <select
            class="input--select"
            formControlName="secondReportingPerson"
            [class.is-invalid]="form.get('secondReportingPerson')?.invalid && form.get('secondReportingPerson')?.touched">
            <option *ngFor="let opt of secondReportingOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <app-note
            text="Please select the co-supervisor/FUM (if any)."
            [isTooltip]="false">
          </app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('secondReportingPerson')"
            fieldName="Second Reporting Person">
          </app-validation-message>
        </div>

        <!-- Monthly Allowance -->
        <div class="form-field">
          <label class="form-label is-required">Monthly Allowance (RM)</label>
          <input
            type="text"
            inputmode="decimal"
            appDecimalAmount
            class="input--text"
            formControlName="monthlyAllowance"
            placeholder="500.00 - 2800.00"
            min="500"
            max="2800"
            [class.is-invalid]="form.get('monthlyAllowance')?.invalid && form.get('monthlyAllowance')?.touched">
          <app-note
            text="Monthly Allowance must be between RM 500.00 and RM 2,800.00."
            [isTooltip]="false">
          </app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('monthlyAllowance')"
            fieldName="Monthly Allowance">
          </app-validation-message>
        </div>

        <!-- Fee Reduction Percentage (GRA only) -->
        <div class="form-field" *ngIf="positionRequested === 'GRA'">
          <label class="form-label is-required">Fee Reduction Percentage</label>
          <select
            class="input--select"
            formControlName="feeReductionPercentage"
            [class.is-invalid]="form.get('feeReductionPercentage')?.invalid && form.get('feeReductionPercentage')?.touched">
            <option value="0">0%</option>
            <option value="50">50%</option>
            <option value="60">60%</option>
            <option value="70">70%</option>
            <option value="80">80%</option>
            <option value="90">90%</option>
            <option value="100">100%</option>
          </select>
          <app-note
            text="Fee reduction is only applicable for Postgraduate (GRA) applications."
            [isTooltip]="false">
          </app-note>
          <app-validation-message 
            class="form-validation-note--error"
            [control]="form.get('feeReductionPercentage')"
            fieldName="Fee Reduction Percentage">
          </app-validation-message>
        </div>

      </div>
    </div>
  </div>
  <!-- /Appointment & Compensation Card -->

</form>
