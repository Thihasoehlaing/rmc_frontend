<div class="date-range-picker" [class.is-open]="isOpen()" [class.is-disabled]="disabled">
  <span class="form-label">Submission Date</span>
  <button
    class="date-range-picker__trigger input--text"
    type="button"
    [disabled]="disabled"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="dialog"
    (click)="toggleCalendar()"
  >
    <span [class.date-range-picker__placeholder]="!displayValue">
      {{ displayValue || 'Select date range' }}
    </span>
  </button>

  @if (isOpen()) {
    <div class="date-range-picker__panel" role="dialog" aria-label="Submission date range">
      <header class="date-range-picker__header">
        <button type="button" aria-label="Previous month" (click)="previousMonth($event)">
          <span class="material-icons">chevron_left</span>
        </button>
        <div class="date-range-picker__month">
          <span>{{ monthLabel }}</span>
          <span>{{ yearLabel }}</span>
        </div>
        <button type="button" aria-label="Next month" (click)="nextMonth($event)">
          <span class="material-icons">chevron_right</span>
        </button>
      </header>

      <div class="date-range-picker__weekdays" aria-hidden="true">
        @for (day of weekDays; track day) {
          <span>{{ day }}</span>
        }
      </div>

      <div class="date-range-picker__days">
        @for (day of calendarDays(); track day.iso) {
          <button
            type="button"
            [class.is-muted]="!day.inCurrentMonth"
            [class.is-selected]="day.isInRange"
            [class.is-range-start]="day.isRangeStart"
            [class.is-range-end]="day.isRangeEnd"
            [class.is-today]="day.isToday"
            [attr.aria-label]="day.iso"
            (click)="selectDay(day)"
          >
            {{ day.day }}
          </button>
        }
      </div>
    </div>
  }
</div>
