<main class="settings-page">
  <app-settings-page-header
    [title]="'Departments'"
    [description]="'Review departments synced from the staff directory source.'"
    icon="apartment"
  >
    <app-action-button
      [label]="'Staff Directory'"
      type="secondary"
      size="small"
      [icon]="'badge'"
      [disabled]="isLoading()"
      (clicked)="goToStaffDirectory()"
    />
  </app-settings-page-header>

  <app-search-toolbar
    [query]="nameSearch()"
    (queryChange)="nameSearch.set($event)"
    [disabled]="isLoading()"
    [placeholder]="'Search by department name'"
    [label]="'Search departments by name'"
    (search)="search()"
    (reset)="resetFilters()"
  >
  </app-search-toolbar>

  <app-settings-panel [title]="'Departments'" [count]="totalItems()" [flush]="true"
    ><app-action-button
      panelActions
      panelActions
      [label]="'Refresh'"
      type="secondary"
      size="small"
      [icon]="'refresh'"
      [disabled]="isLoading()"
      (clicked)="loadDepartments()"
    />

    @if (isLoading()) {
      <app-state title="Loading departments" icon="hourglass_empty" />
    } @else if (loadFailed()) {
      <app-state
        [title]="'Unable to load departments'"
        [description]="'Check the API connection and try again.'"
        [icon]="'cloud_off'"
        [error]="true"
        ><app-action-button
          [label]="'Try Again'"
          type="primary"
          size="small"
          (clicked)="loadDepartments()"
      /></app-state>
    } @else if (departments().length === 0) {
      <app-state
        [title]="'No departments found'"
        [description]="'Adjust the department name filter and try again.'"
        [icon]="'apartment'"
      ></app-state>
    } @else {
      <app-data-table
        [dense]="true"
        [embedded]="true"
        [columns]="columns"
        [rows]="departments()"
        [rowTrackFn]="rowTrackFn"
      >
        <ng-template #rowTemplate let-row let-index="index">
          <tr>
            <td class="is-align-center">{{ rowNumber(index) }}</td>
            <td>
              <strong class="department-name">{{ row.department_name }}</strong>
            </td>
            <td class="is-align-center">{{ row.staff_count }}</td>
            <td>
              <app-status-badge>{{ row.department_type }}</app-status-badge>
            </td>
          </tr>
        </ng-template>
      </app-data-table>
    }

    @if (!isLoading() && !loadFailed()) {
      <div panelFooter>
        <app-pagination
          [currentPage]="page()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizeOptions"
          [totalItems]="totalItems()"
          [itemCount]="departments().length"
          itemLabel="departments"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        >
        </app-pagination>
      </div>
    }
  </app-settings-panel>
</main>
