<main class="settings-page">
  <app-settings-page-header
    title="Main Settings"
    icon="settings"
    eyebrow="Platform administration"
    description="Manage shared configuration, people, access and application setup."
  >
    <app-status-badge>{{ cards.length }} modules</app-status-badge>
  </app-settings-page-header>
  <app-settings-panel title="Configuration areas" [count]="cards.length">
    <nav class="settings-module-grid" aria-label="Main Settings modules">
      @for (card of cards; track card.route) {
        <a [routerLink]="card.route" [attr.aria-label]="'Open ' + card.title">
          <span class="settings-module-icon material-icons" aria-hidden="true">{{
            card.icon
          }}</span>
          <div>
            <strong>{{ card.title }}</strong>
            <p>{{ card.description }}</p>
          </div>
          <span class="material-icons settings-module-arrow" aria-hidden="true">arrow_forward</span>
        </a>
      }
    </nav>
  </app-settings-panel>
</main>
