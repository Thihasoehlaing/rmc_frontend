<main class="settings-page vote-numbers-page">
  <app-settings-page-header
    [title]="'Vote Numbers'"
    [description]="'Review vote numbers by form, code, and active status.'"
    icon="pin"
  >
  </app-settings-page-header>

  <app-search-toolbar
    [query]="codeFilter()"
    (queryChange)="codeFilter.set($event)"
    [disabled]="isLoading()"
    [placeholder]="'Enter code...'"
    [label]="'Search vote number code'"
    (search)="search()"
    (reset)="resetFilters()"
  >
    <div class="settings-filter">
      <app-dropdown
        emptyOptionLabel="All"
        [label]="'Form'"
        placeholder="Search form..."
        [options]="formOptions()"
        [loading]="optionsLoading()"
        [ngModel]="selectedFormCode()"
        (ngModelChange)="selectedFormCode.set($event)"
      ></app-dropdown>
    </div>

    <div class="settings-filter">
      <app-dropdown
        [label]="'Status'"
        [options]="[
          { value: 'all', label: 'All' },
          { value: 'active', label: 'Active' },
          { value: 'inactive', label: 'Inactive' },
        ]"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        [disabled]="isLoading()"
      />
    </div>
  </app-search-toolbar>

  <app-settings-panel [title]="'Vote Numbers'" [count]="totalItems()" [flush]="true">
    @if (isLoading()) {
      <app-state title="Loading vote numbers" icon="hourglass_empty" />
    } @else if (loadFailed()) {
      <app-state
        [title]="'Unable to load vote numbers'"
        [description]="'Check the API connection and try again.'"
        [icon]="'cloud_off'"
        [error]="true"
        ><app-action-button
          [label]="'Try Again'"
          type="primary"
          size="small"
          (clicked)="loadVoteNumbers()"
      /></app-state>
    } @else if (voteNumbers().length === 0) {
      <app-state
        [title]="'No vote numbers found'"
        [description]="'Adjust the filters and search again.'"
        [icon]="'pin'"
      ></app-state>
    } @else {
      <app-data-table
        [dense]="true"
        [embedded]="true"
        [columns]="columns"
        [rows]="voteNumbers()"
        [rowTrackFn]="rowTrackFn"
      >
        <ng-template #rowTemplate let-row let-index="index">
          <tr>
            <td class="is-align-center">{{ rowNumber(index) }}</td>
            <td>
              <span class="vote-number-forms" [title]="formSummary(row)">
                {{ formSummary(row) }}
              </span>
            </td>
            <td class="is-align-center">
              <app-status-badge [intent]="'info'">{{ row.code }}</app-status-badge>
            </td>
            <td class="is-align-center">
              <app-status-badge [intent]="!row.is_active ? 'warning' : 'success'">
                {{ row.statusLabel }}
              </app-status-badge>
            </td>
            <td class="is-align-center">
              <div class="settings-actions">
                <app-action-button
                  [label]="'Edit dropdown option'"
                  type="ghost"
                  size="small"
                  [icon]="'edit'"
                  [iconOnly]="true"
                  [ariaLabel]="'Edit dropdown option'"
                  [title]="'Edit dropdown option'"
                  (clicked)="openEditDialog(row)"
                />
              </div>
            </td>
          </tr>
        </ng-template>
      </app-data-table>
    }

    @if (!isLoading() && !loadFailed()) {
      <div panelFooter>
        <app-pagination
          [currentPage]="page()"
          [totalPages]="totalPages()"
          [pageSize]="pageSize()"
          [pageSizeOptions]="pageSizeOptions"
          [totalItems]="totalItems()"
          [itemCount]="voteNumbers().length"
          itemLabel="vote numbers"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        >
        </app-pagination>
      </div>
    }
  </app-settings-panel>

  <app-dialog
    [isOpen]="showEditor()"
    title="Edit Vote Number"
    density="compact"
    size="small"
    [closeDisabled]="isSaving()"
    (close)="closeEditor()"
  >
    <form id="vote-editor" class="settings-editor" (ngSubmit)="saveModal(editor)">
      <app-field label="Vote Number" controlId="vote-code" [required]="true"
        ><input
          appInput
          id="vote-code"
          name="code"
          [(ngModel)]="editor.code"
          required
          [disabled]="isSaving()"
      /></app-field>
      <app-field label="Description" controlId="vote-description" [required]="true"
        ><input
          appInput
          id="vote-description"
          name="description"
          [(ngModel)]="editor.name"
          required
          [disabled]="isSaving()"
      /></app-field>
      <app-dropdown
        label="Included forms"
        [isMulti]="true"
        [options]="formOptions()"
        [(ngModel)]="editor.appliesTo"
        name="forms"
        [disabled]="isSaving()"
      />
      <app-toggle
        label="Active"
        [checked]="editor.status === 'Active'"
        (checkedChange)="editor.status = $event ? 'Active' : 'Inactive'"
        [disabled]="isSaving()"
      />
    </form>
    <div dialog-footer class="settings-actions">
      <app-action-button
        label="Cancel"
        type="secondary"
        size="small"
        [disabled]="isSaving()"
        (clicked)="closeEditor()"
      />
      <app-action-button
        label="Save"
        size="small"
        buttonType="submit"
        formId="vote-editor"
        [loading]="isSaving()"
        [disabled]="
          isSaving() || !editor.code?.trim() || !editor.name.trim() || !editor.appliesTo.length
        "
      />
    </div>
  </app-dialog>
</main>
