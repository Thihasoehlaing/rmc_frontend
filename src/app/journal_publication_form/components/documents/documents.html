
<form [formGroup]="documentsForm" class="form-section">
  <app-custom-header icon="description" title="Documents"></app-custom-header>
  <div class="card">
    <app-custom-subheader title="Upload Supporting Documents"></app-custom-subheader>
    <div class="card__content">
    <div class="section-fields">
      <div class="form-field">
        <label class="form-label "></label>
        <p class="form-hint"></p>
        <app-file-upload
          #acceptanceNotificationUpload
          label="Acceptance Notification"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload acceptance notification PDF"
          (fileSelected)="onDocumentSelected('acceptanceNotification', $any($event))">
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('acceptanceNotification')"></app-validation-message>
      </div>

      <div class="form-field">
        <label class="form-label "></label>
        <p class="form-hint"></p>
        <app-file-upload
          #reviewersFeedbackUpload
          label="Reviewers' Feedback"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload reviewers' feedback PDF"
          (fileSelected)="onDocumentSelected('reviewersFeedback', $any($event))">
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('reviewersFeedback')"></app-validation-message>
      </div>

      <div class="form-field">
        <label class="form-label "></label>
        <p class="form-hint"></p>
        <app-file-upload
          #scopusUpload
          label="Screenshot of SCOPUS CiteScore"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload SCOPUS CiteScore screenshot PDF"
          (fileSelected)="onDocumentSelected('scopusEvidencePublication', $any($event))">
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('scopusEvidencePublication')"></app-validation-message>
      </div>

      <!-- Turnitin Report -->
      <div class="form-field">
        <label class="form-label "></label>
        <p class="form-hint"></p>
        <app-file-upload
          #turnitinReportUpload
          label="Turnitin Report"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload Turnitin report PDF"
          (fileSelected)="onDocumentSelected('turnitinReport', $any($event))">  
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('turnitinReport')"></app-validation-message>
      </div>

      <!-- Final Paper Draft -->
      <div class="form-field">
        <label class="form-label "></label>
        <p class="form-hint"></p>
        <app-file-upload
          #finalPaperUpload
          label="Final Paper Draft"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload final paper draft PDF"
          (fileSelected)="onDocumentSelected('finalPaperDraft', $any($event))">
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('finalPaperDraft')"></app-validation-message>
      </div>

      <!--Journal Invoice -->
      <div class="form-field">
        <div class="upload-field-header">
          <div class="title-with-tooltip">
            <h3 class="upload-field-title is-required">Journal Invoice</h3>
            <app-note
              text="Please ensure billing name is: Asia Pacific University Sdn. Bhd."
              [isTooltip]="true">
            </app-note>
          </div>
          <p class="upload-field-subtitle">Max file size: 10 MB. PDF ONLY</p>
        </div>
        <app-file-upload
          #journalInvoiceUpload
          label="Journal Invoice"
          [accept]="PDF_ACCEPT"
          [maxSizeMB]="MAX_FILE_SIZE_MB"
          placeholder="Upload journal invoice PDF"
          (fileSelected)="onDocumentSelected('journalInvoice', $any($event))">  
        </app-file-upload>
        <app-validation-message [control]="documentsForm.get('journalInvoice')"></app-validation-message>
      </div>
    </div>
    </div>
  </div>

  <div class="card">
    <app-custom-subheader title="Manuscript Details"></app-custom-subheader>
    <div class="card__content">
    <div class="section-fields">
      <!-- Internal Review -->
      <div class="form-field">
        <label class="form-label is-required">The manuscript has been internally reviewed for the quality of content and English.</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" value="yes" formControlName="manuscriptInternallyReviewed">
            <span>Yes</span>
          </label>
          <label class="radio-label">
            <input type="radio" value="no" formControlName="manuscriptInternallyReviewed">
            <span>No</span>
          </label>
        </div>
        <app-validation-message [control]="documentsForm.get('manuscriptInternallyReviewed')"></app-validation-message>
      </div>

      <div class="form-field">
        <label class="form-label is-required">Name of Reviewer</label>
        <input
          type="text"
          class="input--text"
          formControlName="reviewerName"
          placeholder="Enter reviewer name">
        <app-validation-message [control]="documentsForm.get('reviewerName')"></app-validation-message>
      </div>

      <div class="form-field">
        <div class="label-with-note">
          <label class="form-label is-required">Has the manuscript and content been published in another journal or conference etc.?</label>
          <app-note text=" Manuscript must not be published previously" [isTooltip]="true"></app-note>
        </div>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" value="yes" formControlName="manuscriptPreviouslyPublished">
            <span>Yes</span>
          </label>
          <label class="radio-label">
            <input type="radio" value="no" formControlName="manuscriptPreviouslyPublished">
            <span>No</span>
          </label>
        </div>
        <app-validation-message [control]="documentsForm.get('manuscriptPreviouslyPublished')"></app-validation-message>
      </div>
    </div>
    </div>
  </div>
</form>
