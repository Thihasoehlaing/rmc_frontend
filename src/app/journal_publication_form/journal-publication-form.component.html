<div class="wizard-container">
  <div class="wizard-sidebar">
    <app-step-indicator 
      [steps]="steps" 
      [currentStep]="currentStep"
      [stepStatuses]="stepStatuses"
      (stepClick)="onStepClick($event)">
    </app-step-indicator>
  </div>

  <div class="wizard-content">
    <app-journal-details *ngIf="currentStep === 1"></app-journal-details>
    <app-authors-details *ngIf="currentStep === 2"></app-authors-details>
  </div>
</div>
