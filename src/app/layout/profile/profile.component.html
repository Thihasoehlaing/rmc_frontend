<div class="profile-page">
  <header class="profile-header">
    <h1>Account Settings</h1>
    <p>Manage your RMC profile and preferences</p>
  </header>

  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
    <div class="profile-grid">

      <!-- User Details Section -->
      <section class="profile-section card" formGroupName="userDetails">
        <div class="card__header">
          <h2 class="card__title">
            <span class="material-icons">badge</span>
            User Details
          </h2>
        </div>
        <div class="card__content section-fields">
          <div class="form-field">
            <label class="form-label">Username</label>
            <input type="text" class="input--text" formControlName="username">
          </div>

          <div class="row row--2">
            <div class="form-field">
              <label class="form-label">First Name</label>
              <input type="text" class="input--text" formControlName="firstName">
            </div>
            <div class="form-field">
              <label class="form-label">Last Name</label>
              <input type="text" class="input--text" formControlName="lastName">
            </div>
          </div>

          <div class="form-field">
            <label class="form-label">Email Address</label>
            <input type="email" class="input--text" formControlName="email">
          </div>

          <div class="form-field">
            <label class="form-label">Time Zone</label>
            <select class="input--text" formControlName="timeZone">
              <option value="(MYST) Asia - Kuala Lumpur">(MYST) Asia - Kuala Lumpur</option>
              <option value="(UTC) Coordinated Universal Time">(UTC) Coordinated Universal Time</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Security Sections -->
      <div class="security-column">

        <!-- Change Password Section -->
        <section class="profile-section card" formGroupName="changePassword">
          <div class="card__header">
            <h2 class="card__title">
              <span class="material-icons">lock</span>
              Change Password
            </h2>
          </div>
          <div class="card__content section-fields">
            <div class="form-field">
              <label class="form-label">New Password</label>
              <input type="password" class="input--text" formControlName="password" placeholder="••••••••">
            </div>
            <div class="form-field">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="input--text" formControlName="confirmPassword" placeholder="••••••••">
            </div>
          </div>
        </section>

        <!-- Authentication Section (Verification) -->
        <section class="profile-section card card--auth" formGroupName="authentication">
          <div class="card__header">
            <h2 class="card__title">
              <span class="material-icons">verified_user</span>
              Authentication
            </h2>
          </div>
          <div class="card__content section-fields">
            <p class="auth-hint">Enter your current password to save changes to your profile.</p>
            <div class="form-field">
              <label class="form-label">Current Password</label>
              <input type="password" class="input--text" formControlName="currentPassword"
                placeholder="Required for any update">
            </div>
          </div>
        </section>

        <!-- Action Button -->
        <div class="action-footer">
          <button type="submit" class="btn btn--primary btn--lg">
            <span class="material-icons">save</span>
            Save Profile Changes
          </button>
        </div>
      </div>

    </div>
  </form>
</div>
