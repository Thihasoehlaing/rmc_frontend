<div class="admin-settings-container">
  <div class="admin-settings-header">
    <h1 class="admin-settings-title">Admin Settings</h1>
    <p class="admin-settings-subtitle">Choose a category to manage its configuration in detail.</p>
  </div>

  <div class="admin-settings-grid">
    <div *ngFor="let card of cards" class="card admin-card">
      <a [routerLink]="card.route" class="admin-card__link" [attr.aria-label]="'Manage ' + card.title">
        <div class="admin-card__content">
          <div class="admin-card__icon-section">
            <span class="material-icons admin-card__icon">{{ card.icon }}</span>
            <span class="admin-card__count">{{ card.itemCount }} items</span>
          </div>
          <h2 class="admin-card__title">{{ card.title }}</h2>
          <p class="admin-card__description">{{ card.description }}</p>
        </div>
        <div class="admin-card__footer">
          <span class="admin-card__manage-link">
            Manage
            <span class="material-icons">arrow_forward</span>
          </span>
        </div>
      </a>
  </div>
</div>
