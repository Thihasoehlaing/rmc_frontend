<div class="staff-access-page">
  <div class="staff-access-page__header">
    <a href="/settings/admin-settings" class="back-button" aria-label="Back to Admin Settings">
      <span class="material-icons">arrow_back</span>
    </a>

    <div class="staff-access-page__copy">
      <p class="staff-access-page__eyebrow">Admin Settings</p>
      <h1 class="staff-access-page__title">Staff Access</h1>
      <p class="staff-access-page__description">Manage blocked staff and per-form access restrictions.</p>
    </div>
  </div>

  <div class="staff-access-grid">
    <a *ngFor="let card of cards" [href]="'/settings/staff-access?form=' + card.id" class="staff-card card">
      <div class="staff-card__icon-wrap">
        <span class="material-icons staff-card__icon">{{ card.icon }}</span>
      </div>

      <div class="staff-card__body">
        <h2 class="staff-card__title">{{ card.title }}</h2>
        <p class="staff-card__subtitle">{{ card.subtitle }}</p>
      </div>

      <div class="staff-card__footer">
        <span class="badge badge-info staff-card__badge">{{ card.badge }}</span>
        <span class="material-icons staff-card__arrow">chevron_right</span>
      </div>
    </a>
  </div>
</div>
