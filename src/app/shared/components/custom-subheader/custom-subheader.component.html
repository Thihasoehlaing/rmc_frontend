<div class="custom-subheader">
  @if (icon) {
    <span class="material-icons subheader-icon--material">{{ icon }}</span>
  } @else if (iconSvg) {
    <div class="subheader-icon" [innerHTML]="iconSvg"></div>
  }
  <h3 class="subheader-text">{{title}}</h3>
  @if (tooltip) {
    <app-note [text]="tooltip" [isTooltip]="true"></app-note>
  }
</div>
