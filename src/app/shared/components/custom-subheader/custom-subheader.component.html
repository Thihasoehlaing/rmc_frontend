<div class="custom-subheader">
  @if (icon) {
    <span class="material-icons subheader-icon--material">{{ icon }}</span>
  } @else if (svgIcon) {
    <app-svg-icon class="subheader-icon" [icon]="svgIcon"></app-svg-icon>
  }
  <h3 class="subheader-text">{{ title }}</h3>
  @if (tooltip) {
    <app-field-note>{{ tooltip }}</app-field-note>
  }
</div>
