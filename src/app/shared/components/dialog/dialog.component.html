@if (isOpen) {
  <div
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title-' + dialogId"
    (click)="onOverlayClick($event)"
    (keydown.escape)="onEscape($event)"
    [attr.aria-describedby]="description ? 'dialog-description-' + dialogId : null"
  >
    <div
      class="modal-dialog"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      [class.modal-dialog--compact]="density === 'compact'"
      [class.modal-dialog--small]="size === 'small'"
      [class.modal-dialog--large]="size === 'large'"
      [style.max-width]="width ?? null"
      [style.max-height]="maxHeight ?? null"
      [style.height]="height ?? null"
      (click)="$event.stopPropagation()"
    >
      <!-- Header ─────────────────────────────────────────────── -->
      <header class="modal-dialog__header">
        <div class="modal-dialog__heading">
          <h4 [id]="'dialog-title-' + dialogId">{{ title }}</h4>
          @if (description) {
            <p [id]="'dialog-description-' + dialogId">{{ description }}</p>
          }
        </div>
        <button
          type="button"
          class="modal-dialog__close"
          aria-label="Close dialog"
          [disabled]="closeDisabled"
          (click)="close.emit()"
        >
          <span class="material-icons">close</span>
        </button>
      </header>

      <!-- Body — projected by consumer ────────────────────────── -->
      <div class="modal-dialog__body">
        <ng-content></ng-content>
      </div>

      <!-- Footer — projected via [dialog-footer] attribute ───── -->
      <footer class="modal-dialog__footer">
        <ng-content select="[dialog-footer]"></ng-content>
      </footer>
    </div>
  </div>
}
