<div class="form-page-skeleton" role="status" aria-busy="true" [attr.aria-label]="loadingLabel">
  <span class="sr-only">{{ loadingLabel }}</span>
  <div class="form-page-skeleton__steps">
    @for (step of [1, 2, 3, 4]; track step) {
      <span class="skeleton-block form-page-skeleton__step"></span>
    }
  </div>
  @if (showBatchCard) {
    <section class="form-page-skeleton__batch" aria-hidden="true">
      <div class="form-page-skeleton__batch-section">
        <span class="skeleton-block form-page-skeleton__batch-badge"></span>
        <span class="skeleton-block form-page-skeleton__batch-id"></span>
      </div>
      <div class="form-page-skeleton__batch-section form-page-skeleton__batch-period">
        <div class="form-page-skeleton__batch-period-label">
          <span class="skeleton-block form-page-skeleton__batch-icon"></span>
          <span class="skeleton-block form-page-skeleton__batch-label"></span>
        </div>
        <span class="skeleton-block form-page-skeleton__batch-dates"></span>
      </div>
    </section>
  }
  @for (section of sectionItems; track section) {
    <section class="form-page-skeleton__section">
      <span class="skeleton-block form-page-skeleton__heading"></span>
      <div class="form-page-skeleton__fields">
        @for (field of fieldItems; track field) {
          <div class="form-page-skeleton__field">
            <span class="skeleton-block form-page-skeleton__label"></span>
            <span class="skeleton-block form-page-skeleton__control"></span>
          </div>
        }
      </div>
    </section>
  }
</div>
