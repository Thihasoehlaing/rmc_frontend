<footer class="form-wizard-nav">

  <!-- ── Left: Previous ───────────────────────────────────────── -->
  <div class="nav-group nav-group--left">
    <button
      type="button"
      class="btn btn-ghost btn--nav"
      [disabled]="isFirstStep"
      (click)="prev.emit()">
      <span class="material-icons">arrow_back</span>
      Previous
    </button>
  </div>

  <!-- ── Center: Step counter ──────────────────────────────────── -->
  <span class="nav-step-counter">Step {{ currentStep }} of {{ totalSteps }}</span>

  <!-- ── Right: Save Draft + Next / Submit ─────────────────────── -->
  <div class="nav-group nav-group--right">
    <button
      type="button"
      class="btn btn-ghost btn--action"
      [disabled]="isSaving"
      (click)="saveDraft.emit()">
      <span class="material-icons">save_alt</span>
      @if (isSaving) { Saving… } @else { Save as Draft }
    </button>

    @if (!isLastStep) {
      <button
        type="button"
        class="btn btn-primary btn--nav"
        (click)="next.emit()">
        Next
        <span class="material-icons">arrow_forward</span>
      </button>
    }

    @if (isLastStep) {
      <button
        type="button"
        class="btn btn-primary btn--submit"
        [disabled]="isSubmitting"
        (click)="submitForm.emit()">
        <span class="material-icons">send</span>
        @if (isSubmitting) { Submitting… } @else { Submit Application }
      </button>
    }
  </div>

</footer>
