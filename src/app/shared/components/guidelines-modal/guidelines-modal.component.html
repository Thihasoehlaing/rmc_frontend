@if (isOpen()) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ title }}</h2>
        <button class="btn-close" type="button" (click)="close()" aria-label="Close guidelines">
          &times;
        </button>
      </div>

      <div class="modal-body">
        @if (isLoading()) {
          <div
            class="guidelines-skeleton"
            role="status"
            aria-label="Loading guidelines"
          >
            <span class="skeleton-block guidelines-skeleton__heading"></span>
            <div class="guidelines-skeleton__section">
              <span
                class="skeleton-block guidelines-skeleton__line guidelines-skeleton__line--long"
              ></span>
              <span
                class="skeleton-block guidelines-skeleton__line guidelines-skeleton__line--medium"
              ></span>
              <span
                class="skeleton-block guidelines-skeleton__line guidelines-skeleton__line--short"
              ></span>
            </div>
            <div class="guidelines-skeleton__section">
              <span class="skeleton-block guidelines-skeleton__subheading"></span>
              <span
                class="skeleton-block guidelines-skeleton__line guidelines-skeleton__line--long"
              ></span>
              <span
                class="skeleton-block guidelines-skeleton__line guidelines-skeleton__line--medium"
              ></span>
            </div>
          </div>
        } @else {
          <div class="guidelines-content" [innerHTML]="content()"></div>
        }
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="close()">
          {{ buttonText }}
        </button>
      </div>
    </div>
  </div>
}
