@if (isTooltip) {
<div class="note-container note-container--tooltip">
  <span class="note-icon">ℹ</span>
  <span class="note-text">
    {{text}}
  </span>
</div>
} @else {
<div class="note-container">
  <span class="note-icon">ℹ</span>
  <span class="note-text">
    <strong>Note:</strong> {{text}}
  </span>
</div>
}
