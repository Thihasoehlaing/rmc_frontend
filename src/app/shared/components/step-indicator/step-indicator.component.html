<nav class="step-indicator" aria-label="Form progress">
  @for (step of steps; track step.label; let i = $index) {

    <!-- Step node -->
    <button
      type="button"
      class="step"
      [class.step--complete]="isComplete(i)"
      [class.step--active]="isActive(i)"
      [class.step--warning]="isWarning(i)"
      [class.step--pending]="isPending(i)"
      [title]="isWarning(i) ? getMissingTooltip(i) : step.label"
      (click)="goToStep(i)"
      [attr.aria-label]="step.label">

      <div class="step__bubble">
        @if (isComplete(i)) {
          <span class="material-icons">check</span>
        } @else if (isWarning(i)) {
          <span class="material-icons">warning_amber</span>
        } @else {
          <span class="material-icons">{{ step.icon }}</span>
        }
      </div>

      <span class="step__label">{{ step.label }}</span>
    </button>

    <!-- Connector (not after last step) -->
    @if (i < steps.length - 1) {
      <div
        class="step-connector"
        [class.step-connector--filled]="isConnectorFilled(i)">
      </div>
    }

  }
</nav>
