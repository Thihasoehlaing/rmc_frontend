<div class="submissions-search" [class.submissions-search--focused]="focused()">
  <span class="material-icons submissions-search__icon">search</span>
  <input
    class="submissions-search__input"
    type="text"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onInput($event)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)" />

  @if (value()) {
    <button class="submissions-search__clear" type="button" (click)="clear()" title="Clear search">
      <span class="material-icons">close</span>
    </button>
  }
</div>
