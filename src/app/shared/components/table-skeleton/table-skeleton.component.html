<div class="table-skeleton" role="status" aria-busy="true" [attr.aria-label]="loadingLabel">
  <span class="sr-only">{{ loadingLabel }}</span>

  @if (showSearch || showTypeFilter) {
    <div class="table-skeleton__toolbar">
      @if (showSearch) {
        <div class="skeleton-block table-skeleton__search"></div>
      }
      @if (showTypeFilter) {
        <div class="skeleton-block table-skeleton__filter"></div>
      }
    </div>
  }

  <div class="table-skeleton__table-wrapper">
    <app-data-table
      class="table-skeleton__table"
      aria-hidden="true"
      [minWidth]="minWidth"
      [dense]="true"
      [embedded]="true"
    >
      <ng-template #tableHeader>
        <tr>
          @for (column of columns; track $index) {
            <th><span class="skeleton-block skeleton-block--header"></span></th>
          }
        </tr> </ng-template
      ><ng-template #tableColumns>
        @for (column of columns; track $index) {
          <col [style.width]="column.width" />
        }
      </ng-template>
      <ng-template #tableBody>
        @for (row of rowItems; track row) {
          <tr>
            @for (column of columns; track $index) {
              <td><span class="skeleton-block skeleton-block--cell"></span></td>
            }
          </tr>
        }
      </ng-template>
    </app-data-table>
  </div>
</div>
